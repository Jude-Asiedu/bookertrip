<!-- Version 2 -->
 <div>
    <h2 class="mb-2 fw-bold">{{ pageTitle }}</h2>
  <nav aria-label="breadcrumb" class="mb-4">
    <ol class="breadcrumb mb-0">
      <li *ngFor="let crumb of breadcrumbs; let last = last"
          class="breadcrumb-item"
          [class.active]="last"
          [attr.aria-current]="last ? 'page' : null">

        <ng-container *ngIf="!last && crumb.url">
          <a [routerLink]="crumb.url" [queryParams]="queryParams" class="text-decoration-none text-dark">
            {{ crumb.label }}
          </a>
        </ng-container>
        <ng-container *ngIf="last || !crumb.url">
          {{ crumb.label }}
        </ng-container>
      </li>
    </ol>
  </nav>

  <!-- Debug / example of query param feature -->
  <!-- <div class="small text-muted">
    <strong>Path:</strong> {{ fullPath }}
    <strong>Query Params:</strong> {{ queryParams | json }}
  </div> -->
 </div>

<div class="container-fluid vh-100 d-flex align-items-center justify-content-center bgSignup">
  <div class="row w-100 shadow-lg rounded-4 overflow-hidden" style="max-width: 950px;">

    <!-- Left: Form -->
    <div class="col-md-6 bg-white p-5 d-flex flex-column justify-content-center">
      <h3 class="fw-bold mb-3">Create an Account</h3>
      <p class="text-muted mb-4">Join us today! It takes only a few steps</p>

      <form>
        <!-- Name -->
        <div class="mb-3">
          <label for="name" class="form-label">Full Name <span class="text-danger">*</span></label>
          <input type="text" class="form-control rounded-pill" id="name" placeholder="John Doe">
        </div>

        <!-- Email -->
        <div class="mb-3">
          <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
          <input type="email" class="form-control rounded-pill" id="email" placeholder="name@example.com">
        </div>

        <!-- Password -->
        <div class="mb-3">
          <label for="password" class="form-label">Password <span class="text-danger">*</span></label>
          <input type="password" class="form-control rounded-pill" id="password" placeholder="Enter password">
        </div>

        <!-- Confirm Password -->
        <div class="mb-4">

          <label for="confirmPassword" class="form-label">Confirm Password <span class="text-danger">*</span></label>
          <input type="password" class="form-control rounded-pill" id="confirmPassword" placeholder="Re-enter password">
        </div>

        <!-- Signup Button -->
        <button type="submit" class="btn btn-dark rounded-pill py-2 w-100 mb-3" routerLink="/dashboard">
          Sign Up
        </button>

        <!-- Divider -->
         <div class="d-flex align-items-center mt-2 mb-3">
            <hr class="flex-grow-1">
            <span class="px-2 text-muted small">Or Continue With</span>
            <hr class="flex-grow-1">
          </div>

        <!-- Social Signup -->
        <div class="d-flex justify-content-center gap-3">
          <button type="button" class="btn btn-outline-dark ">
            <i class="fab fa-google me-2"></i> Google
          </button>
          <button type="button" class="btn btn-outline-primary">
            <i class="fab fa-facebook me-2"></i> Facebook
          </button>
        </div>

        <!-- Already have an account -->
        <p class="text-center mt-4 mb-0 text-muted">
          Already have an account?
          <a routerLink="/login" class="fw-normal text-decoration-none">Log in</a>
        </p>
      </form>
    </div>

    <!-- Right: Background Image -->
    <div class="col-md-6 d-none d-md-block p-0 position-relative">
      <!-- Background -->
      <div class="h-100 w-100 bg-cover"
          >
      </div>

      <!-- Overlay -->
      <div class="position-absolute top-0 start-0 w-100 h-100 bg-dark opacity-50"></div>

      <!-- Overlay text -->
      <div class="position-absolute top-50 start-50 translate-middle text-white text-center px-3">
        <h2 class="fw-bold">Welcome to  <b class="logoText"> BookTrip </b> 🎉</h2>
        <p class="mt-2">Start your journey with us today and unlock exclusive features!</p>
      </div>
    </div>
  </div>
</div>

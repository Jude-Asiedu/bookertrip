<div class="container mt-4 ">
  <!-- Top Row: Search + Total -->
   <div class="card shadow-sm bg-light mb-3 ">
    <div class="card-body">
  <div class="d-flex align-items-end justify-content-between my-2">
    <div class="fw-light fs-5">
      Total Cities: {{ citiesList.length }}
    </div>
    <div class="input-group w-auto">
      <input type="text" class="form-control" placeholder="Search cities..." [(ngModel)]="searchText" />
      <!-- <span class="input-group-text">
        <i class="fas fa-search"></i>
      </span> -->
    </div>
    <button class="btn btn-outline-dark rounded-0 "> <i class="fa-solid fa-plus"></i> Add New City</button>
  </div></div>
</div>
  <!-- Table -->
  @if (citiesList.length > 0) {
    <div class="table-responsive shadow rounded-1 ">
      <table class="table table-hover  align-middle  no-wrap table-hover v-middle">
        <thead class="table-light">
          <tr>
            <th>#</th>
            <th>City Name</th>
            <th>Country</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          @for (city of filteredCities(); track city;let i = $index) {
          <tr class="card-hover">
            <td>{{ i + 1 }}.</td>
            <td>{{ city.city_name }}</td>
            <td>{{ city.country_iso2 }}</td>
            <td>
              <button class="btn btn-sm btn-light-primary me-1">
                <i class="fas fa-edit"></i>
              </button>
              <button class="btn btn-sm btn-light-danger ms-3">
                <i class="fas fa-trash-alt"></i>
              </button>
            </td>
          </tr>
          }
        </tbody>
      </table>
    </div>
    } @else {
    <div class="text-center my-5 text-muted">
      <i class="fa-solid fa-city fa-2x mb-2"></i>
      <h3>No cities available</h3>
    </div>

  }
</div>

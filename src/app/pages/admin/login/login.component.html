<div class="container-fluid vh-100 d-flex align-items-center justify-content-center loginBackground">
  <div class="row w-100 shadow rounded-4 overflow-hidden" style="max-width: 900px; min-height: 550px;">
    <!-- Left: Login form -->
    <div class="col-md-6 bg-white p-5 d-flex flex-column justify-content-center">
      <h3 class="text-center mb-2">Log In</h3>
      <p class="text-center text-muted mb-4">Welcome back! Please enter your details</p>

      <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
        <!-- Email -->
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input
            id="email"
            type="email"
            class="form-control rounded-pill"
            formControlName="email"
            placeholder="Enter your email">
        </div>

        <!-- Password -->
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input
            id="password"
            type="password"
            class="form-control rounded-pill"
            formControlName="password"
            placeholder="Enter your password">
          <div class="mt-2">
            <a  routerLink="/reset-passsword"  class="text-decoration-none  small">Forgot password?</a>
          </div>
        </div>

        <!-- Login button -->
        <button type="submit" class="btn btn-dark w-100 rounded-pill py-2">
          Log In
        </button>
      </form>

      <!-- Divider -->
      <div class="d-flex align-items-center my-4">
        <hr class="flex-grow-1">
        <span class="px-2 text-muted small">Or Continue With</span>
        <hr class="flex-grow-1">
      </div>

      <!-- Social logins -->
      <div class="d-flex gap-3">
        <button class="btn btn-outline-dark w-50 rounded-pill" (click)="signInWithGoogle()">
          <i class="fab fa-google me-2"></i> Google
        </button>
        <button class="btn btn-light w-50 rounded-pill">
          <i class="fab fa-facebook me-2"></i> Facebook
        </button>
      </div>

      <!-- Signup link -->
      <p class="text-center mt-4 mb-0">
        Don’t have an account?
        <a routerLink="/signup" class="fs-6 text-decoration-none">Sign up</a>
      </p>
    </div>

    <!-- Right: Image / Gradient -->
    <div class="col-md-6 d-none d-md-block p-0">
      <div class="h-100 w-100  d-flex align-items-center justify-content-center text-white imgBack">
        <h4 class="fw-bold">Welcome Back 👋</h4>
      </div>
    </div>
  </div>
</div>
